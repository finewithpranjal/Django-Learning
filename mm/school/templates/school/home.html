<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      table, th, td {
        border : 1px solid black;
      }
    </style>
</head>
<body>
    <table>
        <h3>Student Data</h3>
            <th>Id</th>
            <th>Name</th>
            <th>Roll</th>
            <th>City</th>
            <th>Marks</th>
            <th>Passing Date</th>
            <th>Addmission Date</th>
        {% for student in student_data %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.roll }}</td>
                <td>{{ student.city }}</td>
                <td>{{ student.marks }}</td>
                <td>{{ student.pass_date }}</td>
                <td>{{ student.addmission_date }}</td>
            </tr>
        {% endfor %}
</table>
</body>
</html>
