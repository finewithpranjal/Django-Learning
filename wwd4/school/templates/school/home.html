<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        table, th, tr, td {
            border: 1px solid black;
           
        }
    </style>
</head>
<body>
    <table>
    <h3>Student Information</h3>
    <th>ID</th> 
    <th>Name</th>
    <th>Roll</th>
    <th>City</th>
    <th>Marks</th>
    <th>Passing Date</th>
    <th>Admission Date Time</th>
    {% for student in students %}
    <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.roll }}</td>
        <td>{{ student.city }}</td>
        <td>{{ student.marks }}</td>
        <td>{{ student.pass_date }}</td>
        <td>{{ student.addmission_date }}</td>
    </tr>
    {% endfor %}
    </table>
    <!-- This is for aggregate functions contains average, sum, minimum, maximum and count of marks 
    
    <h3>Average Marks : {{avg_marks.marks__avg}}</h3>
    <h3>Total Marks : {{total.marks__sum}}</h3>
    <h3>minimum Marks : {{minimum.marks__min}}</h3>
    <h3>maximum Marks : {{maximum.marks__max}}</h3>
    <h3>Total Marks count : {{totalcount.marks__count}}</h3> -->
    
</body>
</html>
